user nginx;
worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;


    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 75;
    server_tokens off;
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Railway's edge appends itself to X-Forwarded-For, so the leftmost entry is
    # the real client. Only used for the access log — Symfony does its own
    # right-to-left walk from TRUSTED_PROXIES, which needs REMOTE_ADDR left alone.
    map $http_x_forwarded_for $real_client_ip {
        '~^\s*(?P<first>[^,\s]+)' $first;
        default $remote_addr;
    }

    # Most PHP code reads $_SERVER['HTTPS'] and never looks at X-Forwarded-Proto.
    # Default to empty so Railway's plain-HTTP health prober still reads insecure.
    map $http_x_forwarded_proto $https_flag {
        https on;
        default '';
    }

    log_format railway '$real_client_ip - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout railway;

    server {
        listen __PORT__ default_server;
        listen [::]:__PORT__ default_server;
        server_name _;
        root /srv/sylius/public;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Uploaded media and the Liip Imagine cache live on the Railway volume,
        # reached through public/media -> $RAILWAY_VOLUME_MOUNT_PATH/media.
        location /media/ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri /index.php$is_args$args;
        }

        location /build/ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ~ ^/index\.php(/|$) {
            internal;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $https_flag;
            fastcgi_buffers 16 32k;
            fastcgi_buffer_size 64k;
            fastcgi_read_timeout 300;
        }

        # Nothing else in public/ is executable.
        location ~ \.php$ {
            return 404;
        }
    }
}
