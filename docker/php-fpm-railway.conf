[www]
; php-fpm clears the environment by default, which would hide every Railway
; variable from the application.
clear_env = no

; The pool is sized for a Railway container, not for the host's 48 cores.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
